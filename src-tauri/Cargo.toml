[package]
name = "ledger-app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "ledger_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# The runtime is chosen at the type level (`AppRuntime` in src/lib.rs): tauri's
# default features include `wry`, so they are off here and only the
# runtime-independent ones are kept. The Linux build takes tauri-runtime-qt
# below; Windows/macOS re-add `wry` in their target section.
tauri = { version = "2", default-features = false, features = [
    "compression",
    "common-controls-v6",
    "dynamic-acl",
    "x11",
] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
specta = "2.0.0-rc.25"
tauri-specta = { version = "2.0.0-rc.25", features = ["javascript", "typescript"] }
specta-typescript = "0.0.12"
rustledger-core = "0.24.0"
rustledger-parser = "0.24.0"
# `wasm-plugins` runs the ledger's WASM plugins, which is how
# `plugins/rustledger-envelope` reaches the app.
rustledger-loader = { version = "0.24.0", features = ["wasm-plugins"] }
rustledger-query = "0.24.0"
rust_decimal = "1"
# libgit2 bindings for staging and diffing the ledger against HEAD. Default
# features stay off: this app only ever touches a local repository, so the SSH
# and HTTPS transports (and their OpenSSL/libssh2 build chain) are dead weight.
git2 = { version = "0.21", default-features = false }

# Linux: the Qt runtime from the TauriQt repo — Qt windowing (QWindow/QWidget)
# replaces tao and QtWebEngine replaces webkit2gtk. Follows `main`; Cargo.lock
# pins the exact commit.
[target.'cfg(target_os = "linux")'.dependencies]
tauri-runtime-qt = { git = "https://github.com/Alper-Celik/TauriQt" }

# Windows / macOS: the stock wry runtime. Enabling `wry` only here keeps
# WebView2/WKWebView out of the Linux build and Qt out of the others.
[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
tauri = { version = "2", default-features = false, features = ["wry"] }

[features]
# Escape hatch: build the Linux app on wry instead (e.g. to compare engines).
wry = ["tauri/wry"]


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

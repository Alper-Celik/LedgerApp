[package]
name = "ledger-app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "ledger_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
specta = "2.0.0-rc.25"
tauri-specta = { version = "2.0.0-rc.25", features = ["javascript", "typescript"] }
specta-typescript = "0.0.12"
rustledger-core = "0.24.0"
rustledger-parser = "0.24.0"
rustledger-loader = "0.24.0"
rustledger-query = "0.24.0"
rust_decimal = "1"
# Locks without the poisoning error path: no `unwrap` at every lock site.
parking_lot = "0.12"
# libgit2 bindings for staging and diffing the ledger against HEAD. Default
# features stay off: this app only ever touches a local repository, so the SSH
# and HTTPS transports (and their OpenSSL/libssh2 build chain) are dead weight.
git2 = { version = "0.21", default-features = false }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

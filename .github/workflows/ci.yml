name: plugin

on:
  push:
    paths:
      - "plugins/rustledger-envelope/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "plugins/rustledger-envelope/**"
      - ".github/workflows/ci.yml"
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/rustledger-envelope
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: plugins/rustledger-envelope -> target
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Tests
        run: cargo test --locked --all-targets

  wasm:
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/rustledger-envelope
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: plugins/rustledger-envelope -> target
      - name: Build the plugin
        run: cargo build --locked --release --target wasm32-unknown-unknown
      - name: Checksum it
        run: |
          cd "$GITHUB_WORKSPACE/plugins/rustledger-envelope/target/wasm32-unknown-unknown/release"
          sha256sum rustledger_envelope.wasm > rustledger_envelope.wasm.sha256
      # So a branch can hand out the plugin without cutting a release.
      - uses: actions/upload-artifact@v7
        with:
          name: rustledger_envelope
          path: |
            plugins/rustledger-envelope/target/wasm32-unknown-unknown/release/rustledger_envelope.wasm
            plugins/rustledger-envelope/target/wasm32-unknown-unknown/release/rustledger_envelope.wasm.sha256
          if-no-files-found: error

  # Publishing a release is what ships the plugin, and a ledger consumes it as a
  # release asset next to the journal:
  #
  #   plugin "rustledger_envelope.wasm"
  #
  # downloaded from
  #   https://github.com/<owner>/<repo>/releases/latest/download/rustledger_envelope.wasm
  #   https://github.com/<owner>/<repo>/releases/download/<tag>/rustledger_envelope.wasm
  #
  # (a pre-release exercises this pipeline without becoming "latest"), and the
  # `.sha256` beside it is what `sha256sum -c` wants.
  release:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: plugins/rustledger-envelope
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: plugins/rustledger-envelope -> target
      - name: Build the plugin
        run: cargo build --locked --release --target wasm32-unknown-unknown
      - name: Attach the plugin and its checksum to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$GITHUB_WORKSPACE/plugins/rustledger-envelope/target/wasm32-unknown-unknown/release"
          sha256sum rustledger_envelope.wasm > rustledger_envelope.wasm.sha256
          gh release upload "${{ github.event.release.tag_name }}" \
            rustledger_envelope.wasm rustledger_envelope.wasm.sha256 \
            --clobber

  reuse:
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: fsfe/reuse-action@v5
